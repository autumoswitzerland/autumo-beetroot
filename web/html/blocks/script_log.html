<!--  Script: live log via the generic WebSocket action client, fallback reload, dotted line between scrollers. -->
<script>
	const websocketEnabled = "{$websocketEnabled}" === "yes";
	const websocketPath = "{$servletName}{$websocketPath}";
	const websocketAction = "{$websocketActionPath}";
	const websocketPort = "{$websocketPort}";
	const maxLogLines = parseInt("{$logSize}", 10) || 100;
	const fallbackRefreshTime = parseInt("{$logRefreshTime}", 10) || 60;

	var live = null;
	var fallback = null;

	$(document).ready(function() {

		// Tooltips
		$(function() {
		    $(document).tooltip();
		});
		// Year string
		prepareYear();

		// Start the live log; fall back to periodic reloads if unavailable.
		startLive();

		/**
		 * Repainting the line between the bottom and top navigation
		 * buttons.
		 */
		function adjustDistanceLine() {
		    var div1 = document.getElementById('return-to-bottom');
		    var div2 = document.getElementById('return-to-top');
		    var dottedLine = document.getElementById('dottedLine');
			if (!div1 || !div2 || !dottedLine) {
			    return;
			}
		    var div1Rect = div1.getBoundingClientRect();
		    var div2Rect = div2.getBoundingClientRect();
		    var div1Bottom = div1Rect.bottom + window.scrollY;
		    var div2Top = div2Rect.top + window.scrollY;
		    var distance = div2Top - div1Bottom - 12;
		    dottedLine.style.top = div1Bottom + 'px';
		    dottedLine.style.height = distance + 'px';
		}
		window.addEventListener('load', adjustDistanceLine);
		window.addEventListener('resize', adjustDistanceLine);
		window.addEventListener('scroll', adjustDistanceLine);
	});

	function startLive() {
		if (websocketEnabled && window.BeetRootWS && BeetRootWS.isSupported()) {
			live = BeetRootWS.subscribe({
				path: websocketPath,
				port: websocketPort,
				action: websocketAction,
				onSnapshot: renderSnapshot,
				onEvent: appendLogLine,
				onError: function (message) {
					console.warn("WebSocket log action failed: " + message);
				},
				onStatus: updateLiveStatus,
				onGiveUp: function () {
					// The WebSocket is not available; keep the page fresh.
					startFallback();
				}
			});
		} else {
			startFallback();
		}
	}

	function startFallback() {
		if (fallback !== null) {
			return;
		}
		fallback = BeetRootWS.startFallbackCountdown({
			seconds: fallbackRefreshTime,
			onTick: function (remaining) {
				updateLiveStatus('giveup', remaining);
			}
		});
	}

	function updateLiveStatus(state, remaining) {
		var status = document.getElementById('live_status');
		if (!status) {
			return;
		}
		status.classList.remove('is-live', 'is-connecting', 'is-fallback');
		var text = status.querySelector('.text');
		if (state === 'open') {
			status.hidden = false;
			status.classList.add('is-live');
			text.textContent = 'Live';
		} else if (state === 'connecting' || state === 'reconnecting') {
			status.hidden = false;
			status.classList.add('is-connecting');
			text.textContent = 'Connecting';
		} else if (state === 'giveup') {
			status.hidden = false;
			status.classList.add('is-fallback');
			var seconds = (remaining !== undefined && remaining !== null) ? remaining : fallbackRefreshTime;
			text.textContent = 'Refresh ' + seconds + 's';
		} else {
			status.hidden = true;
			text.textContent = '';
		}
	}

	function renderSnapshot(lines) {
		var terminal = document.getElementById("terminal");
		if (!terminal || !Array.isArray(lines)) {
			return;
		}
		// Remove open tooltip bubbles before replacing the content: their
		// target elements disappear and the bubbles would never close.
		$(".ui-tooltip").remove();
		var atBottom = isAtBottom();
		terminal.innerHTML = lines.join("");
		if (atBottom) {
			window.scrollTo(0, document.body.scrollHeight);
		}
	}

	function appendLogLine(line) {
		if (line === null || line === undefined) {
			return;
		}
		var terminal = document.getElementById("terminal");
		if (!terminal) {
			return;
		}
		var atBottom = isAtBottom();
		terminal.insertAdjacentHTML("beforeend", line);

		// Rebuild from the bounded server snapshot if the DOM grows too much.
		if (live !== null && live.isOpen() && terminal.childNodes.length > maxLogLines * 10) {
			live.send({command: "snapshot"});
		}

		if (atBottom) {
			window.scrollTo(0, document.body.scrollHeight);
		}
	}

	function isAtBottom() {
		return (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 50);
	}

</script>

<script src="/js/header.js" data-app="{$serverName}"></script>
