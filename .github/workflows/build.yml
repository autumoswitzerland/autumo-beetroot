###############################################################################
#
#  autumo beetRoot - GitHub Build & Release Workflow
#  Version: 1.0
#
#------------------------------------------------------------------------------
#
#  2026 autumo GmbH
#
#  Builds the product packages with make.sh. The generated ZIP and WAR
#  archives from product/ are attached to a GitHub Release when the release
#  option is selected. The release notes are taken from the matching
#  CHANGELOG.md section.
#
###############################################################################

name: Build and Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match VERSION in make.sh, e.g. v3.3.0)'
        required: true
        default: 'v3.3.0'
        type: string
      create_release:
        description: 'Create a GitHub Release from the build artifacts'
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Build product
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Validate tag and read version
        id: meta
        shell: bash
        run: |
          VERSION=$(sed -n 's/^VERSION=//p' make.sh | head -n 1)
          TAG="${{ inputs.tag }}"

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine VERSION from make.sh"
            exit 1
          fi

          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match project version 'v$VERSION' from make.sh"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build product packages
        shell: bash
        run: |
          chmod +x make.sh
          ./make.sh create

      - name: Verify product packages
        shell: bash
        run: |
          shopt -s nullglob
          zips=(product/*.zip)
          wars=(product/*.war)

          if [ ${#zips[@]} -eq 0 ] || [ ${#wars[@]} -eq 0 ]; then
            echo "::error::make.sh did not create the expected ZIP and WAR packages in product/"
            exit 1
          fi

          printf 'Created package: %s\n' "${zips[@]}" "${wars[@]}"

      - name: Upload product packages
        uses: actions/upload-artifact@v4
        with:
          name: autumo-beetroot-packages
          path: |
            product/*.zip
            product/*.war
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.create_release == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download product packages
        uses: actions/download-artifact@v4
        with:
          name: autumo-beetroot-packages
          path: product

      - name: Generate release notes from CHANGELOG.md
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            BEGIN { header = "## [" version "]" }
            index($0, header) == 1 { found = 1 }
            found && /^## \[/ && index($0, header) != 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: autumo beetRoot ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: |
            product/*.zip
            product/*.war
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
